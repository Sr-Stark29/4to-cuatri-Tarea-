<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Store | Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand">NOVA<span>STORE</span></div>
        <p class="subtitle">Accede para continuar a la tienda</p>

        <form id="loginForm">
            <label for="usuario">Nombre de usuario o correo electrónico</label>
            <input type="text" id="usuario" placeholder="ejemplo@correo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit" class="btn primary">Iniciar sesión</button>
            <p id="mensaje" class="mensaje"></p>
        </form>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const mensaje = document.getElementById("mensaje");

            if (usuario && password) {
                window.location.href = "tienda.html";
            } else {
                mensaje.textContent = "Completa todos los campos.";
            }
        });
    </script>
</body>
</html>
